<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img"> <rect x="0" y="0" width="1120" height="250" fill="#ffffff"/>
<title>Схема проверки агентского заказа на индивидуальный маршрут по Чили</title>
<text x="26" y="40" fill="#0E3455" font-size="23" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Один агентский запрос: что подтвердить до оплаты</text>
<rect x="24" y="75" width="198" height="124" rx="12" fill="#f5f8fc" stroke="#ccd8e6"/>
<text x="39" y="100" fill="#0E3455" font-size="16" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">01</text>
<text x="39" y="136" fill="#111827" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Бриф</text>
<text x="39" y="171" fill="#5b6474" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">12–15 дней</text>
<path d="M224 138 l18 0" stroke="#0E3455" stroke-width="2"/>
<rect x="245" y="75" width="198" height="124" rx="12" fill="#f5f8fc" stroke="#ccd8e6"/>
<text x="260" y="100" fill="#0E3455" font-size="16" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">02</text>
<text x="260" y="136" fill="#111827" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Маршрут</text>
<text x="260" y="171" fill="#5b6474" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">2 региона</text>
<path d="M445 138 l18 0" stroke="#0E3455" stroke-width="2"/>
<rect x="466" y="75" width="198" height="124" rx="12" fill="#f5f8fc" stroke="#ccd8e6"/>
<text x="481" y="100" fill="#0E3455" font-size="16" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">03</text>
<text x="481" y="136" fill="#111827" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Состав услуг</text>
<text x="481" y="171" fill="#5b6474" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">private / shared</text>
<path d="M666 138 l18 0" stroke="#0E3455" stroke-width="2"/>
<rect x="687" y="75" width="198" height="124" rx="12" fill="#f5f8fc" stroke="#ccd8e6"/>
<text x="702" y="100" fill="#0E3455" font-size="16" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">04</text>
<text x="702" y="136" fill="#111827" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Документы</text>
<text x="702" y="171" fill="#5b6474" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">роли и оплата</text>
<path d="M887 138 l18 0" stroke="#0E3455" stroke-width="2"/>
<rect x="908" y="75" width="198" height="124" rx="12" fill="#f5f8fc" stroke="#ccd8e6"/>
<text x="923" y="100" fill="#0E3455" font-size="16" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">05</text>
<text x="923" y="136" fill="#111827" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Поддержка</text>
<text x="923" y="171" fill="#5b6474" font-size="14" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">контакты и сбои</text>
<text x="26" y="232" fill="#5b6474" font-size="13" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Схема проверки покупателя, а не утверждение о подтвержденных SLA или фактическом бронировании</text>
</svg>