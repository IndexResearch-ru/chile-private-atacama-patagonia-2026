<text x="28" y="457" fill="#5b6474" font-size="13" font-weight="400" text-anchor="start" font-family="Arial, sans-serif">Источник каждой строки: первичные URL в SOURCE_REGISTER.csv; это сравнение описаний, без мест и баллов</text>
